name: Release integrity

on:
  push:
    branches: [production]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Verify immutable references
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        shell: bash
        run: |
          git fetch origin main production --tags
          test "$(git rev-parse HEAD^{commit})" = "$(git rev-parse origin/main^{commit})"
          test "$(git rev-parse HEAD^{commit})" = "$(git rev-parse origin/production^{commit})"
      - run: npm ci
      - run: npm run ci
